<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <defs>
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d98c"/>
      <stop offset="0.5" stop-color="#e6b34a"/>
      <stop offset="1" stop-color="#9a6f1c"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#caa044"/>
    </linearGradient>
  </defs>
  <!-- diamond crown -->
  <polygon points="25,12 95,12 115,42 60,102 5,42" fill="url(#goldA)" stroke="#7c5a14" stroke-width="2"/>
  <!-- facets -->
  <polyline points="5,42 115,42" fill="none" stroke="#7c5a14" stroke-width="1.6"/>
  <polygon points="25,12 40,42 60,12" fill="url(#goldB)" opacity="0.55"/>
  <polyline points="25,12 40,42 60,102 80,42 95,12" fill="none" stroke="#7c5a14" stroke-width="1.6"/>
  <polyline points="40,42 60,12 80,42" fill="none" stroke="#7c5a14" stroke-width="1.6"/>
  <polygon points="40,42 60,102 80,42" fill="url(#goldB)" opacity="0.35"/>
  <!-- label -->
  <text x="60" y="36" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="11" fill="#3d2c08">Diamant</text>
  <text x="60" y="49" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="11" fill="#3d2c08">Gold</text>
</svg>
